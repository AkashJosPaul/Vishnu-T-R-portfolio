<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Photographer Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0f0f0f;
    --soft: #181818;
    --text: #eaeaea;
    --muted: #bbb;
    --accent: #d4af37;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    line-height: 1.7;
}

/* NAV */
nav {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    padding: 12px;
    z-index: 1000;
}

.nav-container {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
}

.nav-links a {
    color: var(--muted);
    margin-left: 15px;
    text-decoration: none;
}

.nav-links a:hover {
    color: white;
}

/* HERO */
header {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
    url('assets/banner.jpg') center/cover no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding: 0 20px;
}

header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem,6vw,3.5rem);
}

header p {
    color: var(--muted);
    margin-top: 10px;
}

/* SECTIONS */
section {
    padding: 80px 20px;
    max-width: 1100px;
    margin: auto;
}

h2 {
    text-align:center;
    margin-bottom:40px;
    font-family:'Playfair Display', serif;
}

/* GALLERY */
.gallery {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
    gap:12px;
}

.gallery img {
    width:100%;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* CONTACT */
.contact input, .contact textarea {
    width:100%;
    margin-bottom:10px;
    padding:10px;
    background:#1a1a1a;
    border:1px solid #333;
    color:white;
}

/* BUTTON */
.contact button {
    padding:12px;
    background:var(--accent);
    border:none;
    cursor:pointer;
}

/* FOOTER */
footer {
    text-align:center;
    padding:20px;
    background:black;
    color:#777;
}

/* LIGHTBOX */
.lightbox {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.lightbox img {
    max-width:90%;
    max-height:80%;
    border-radius:10px;
}

.lightbox span {
    position:absolute;
    color:white;
    font-size:30px;
    cursor:pointer;
}

.close { top:20px; right:30px; }
.prev { left:30px; }
.next { right:30px; }

/* MOBILE */
@media(max-width:700px){
    .nav-links a {
        margin-left:8px;
        font-size:0.8rem;
    }
}
</style>
</head>

<body>

<nav>
<div class="nav-container">

    <div class="nav-links">

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">✕</span>
    <span class="prev" onclick="change(-1)">❮</span>
    <img id="lightbox-img">
    <span class="next" onclick="change(1)">❯</span>
</div>

<script>
const images = document.querySelectorAll(".img");
let index = 0;

images.forEach((img, i) => {
    img.onclick = () => {
        index = i;
        open();
    }
});

function open() {
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightbox-img").src = images[index].src;
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}

function change(dir) {
    index += dir;
    if(index < 0) index = images.length - 1;
    if(index >= images.length) index = 0;
    document.getElementById("lightbox-img").src = images[index].src;
}

/* keyboard support */
document.addEventListener("keydown", (e)=>{
    if(document.getElementById("lightbox").style.display === "flex"){
        if(e.key === "ArrowRight") change(1);
        if(e.key === "ArrowLeft") change(-1);
        if(e.key === "Escape") closeLightbox();
    }
});
</script>

</body>
